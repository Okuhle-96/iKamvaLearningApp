services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: techforge
      POSTGRES_USER: techforge_app
      POSTGRES_PASSWORD: dev_only_change_me
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - techforge-postgres:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techforge_app -d techforge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  techforge-postgres:
